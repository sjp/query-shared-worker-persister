name: CI

permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 26, latest]
        # `latest` is an early warning about the next Node major, not a merge
        # gate: its leg reports failures without failing the workflow.
        include:
          - node-version: latest
            experimental: true

    continue-on-error: ${{ matrix.experimental == true }}

    steps:
      - uses: actions/checkout@v7
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: ${{ matrix.node-version }}
          cache: true
      - run: vp install --frozen-lockfile
      # The browser suite drives a real Chromium. Cache the download, which is
      # far larger and slower to fetch than the npm dependencies; the key tracks
      # the lockfile because that is where the Playwright version lives.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-
      - run: vp run playwright:install
      - run: vp run check:toolchain
      - run: vp run check
      - run: vp run build
      - run: vp run check:package
      - run: vp run check:types-consumer
      - run: vp run test
